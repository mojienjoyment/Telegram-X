name: 📅 Weekly Beta Build

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    name: Weekly Beta ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9.0
        packages: >-
          platforms;android-37
          platform-tools
          build-tools;34.0.0
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
    
    - name: Decode Keystore (if available)
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
        echo "KEYSTORE_FILE=upload-keystore.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
    
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleArm64LatestDebug --no-daemon --stacktrace
    
    - name: Upload Beta APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-x-weekly-beta
        path: |
          app/build/outputs/apk/arm64/*/app-arm64-v8a-*-debug.apk
        retention-days: 14
    
    - name: Generate Release Notes
      run: |
        echo "# Weekly Beta Build" > release-notes.md
        echo "" >> release-notes.md
        echo "**Build Date:** $(date '+%Y-%m-%d %H:%M')" >> release-notes.md
        echo "**Branch:** ${GITHUB_REF_NAME}" >> release-notes.md
        echo "**Commit:** ${GITHUB_SHA:0:7}" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Recent Changes" >> release-notes.md
        echo "" >> release-notes.md
        git log --oneline -10 >> release-notes.md
    
    - name: Upload Release Notes
      uses: actions/upload-artifact@v4
      with:
        name: weekly-release-notes
        path: release-notes.md
        retention-days: 14
    
    - name: Cleanup
      run: |
        rm -f upload-keystore.jks
        rm -f local.properties
