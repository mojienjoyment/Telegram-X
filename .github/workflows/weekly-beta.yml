name: Weekly Beta Build

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - alpha

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx6g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build Weekly Beta
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-disabled: false

    - name: Install NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
        add-to-path: true

    - name: Setup local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Build ARM64 Beta APK
      run: |
        ./gradlew clean assembleArm64LatestRelease \
          --no-daemon \
          --stacktrace

    - name: Upload to Telegram Channel (Optional)
      if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
      uses: xtenzo/telegram-upload-action@v1.1
      with:
        bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
        files: app/build/outputs/apk/arm64/latest/release/*.apk
        caption: |
          🚀 **Telegram X ARM64 - Weekly Beta**
          
          📅 Build Date: $(date '+%Y-%m-%d')
          🔖 Version: $(grep versionName app/build/outputs/apk/*/latest/release/*.txt | head -1 | cut -d'"' -f2)
          ⚡ Optimized for Android 8.0+ devices
          
          Changes since last build:
          $(git log --oneline -10 --pretty=format:"• %s")
          
          #ARM64 #Beta #TelegramX

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: telegram-x-arm64-weekly-beta
        path: |
          app/build/outputs/apk/arm64/latest/release/*.apk
        retention-days: 14
