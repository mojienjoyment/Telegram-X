name: 🚀 Build & Release ARM64 APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9.0
        packages: >-
          platforms;android-34
          platform-tools
          build-tools;34.0.0
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
    
    - name: Decode Keystore
      if: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
        echo "KEYSTORE_FILE=upload-keystore.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
    
    - name: Set build type
      id: build_type
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
          BUILD_TYPE="release"
        else
          BUILD_TYPE="debug"
        fi
        echo "type=$BUILD_TYPE" >> $GITHUB_OUTPUT
    
    - name: Build APK
      run: |
        chmod +x gradlew
        if [[ "${{ steps.build_type.outputs.type }}" == "release" ]]; then
          ./gradlew clean assembleArm64LatestRelease --no-daemon --stacktrace
        else
          ./gradlew clean assembleArm64LatestDebug --no-daemon --stacktrace
        fi
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: telegram-x-arm64-apk
        path: |
          app/build/outputs/apk/arm64/*/telegram-x-*.apk
          app/build/outputs/apk/arm64/*/app-arm64-v8a-*.apk
        retention-days: 30
    
    - name: Upload Mapping File
      if: ${{ steps.build_type.outputs.type == 'release' }}
      uses: actions/upload-artifact@v4
      with:
        name: proguard-mapping
        path: app/build/outputs/mapping/arm64LatestRelease/mapping.txt
        retention-days: 30
    
    - name: Create Build Info
      run: |
        echo "Build Information" > build-info.txt
        echo "================" >> build-info.txt
        echo "Date: $(date)" >> build-info.txt
        echo "Branch: ${GITHUB_REF_NAME}" >> build-info.txt
        echo "Commit: ${GITHUB_SHA}" >> build-info.txt
        echo "Build Type: ${{ steps.build_type.outputs.type }}" >> build-info.txt
        echo "Min SDK: Android 11 (API 30)" >> build-info.txt
        echo "Target SDK: Android 14 (API 34)" >> build-info.txt
        echo "Architecture: ARM64-v8a only" >> build-info.txt
    
    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt
        retention-days: 30
    
    - name: Create GitHub Release
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/arm64/*/telegram-x-*.apk
          app/build/outputs/apk/arm64/*/app-arm64-v8a-*.apk
        body_path: build-info.txt
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup
      run: |
        rm -f upload-keystore.jks
        rm -f local.properties
